[project]
name = "ctxspy"
version = "0.0.0"
description = "Profile the context window of your LLM agent"
readme = "README.md"
authors = [
    { name = "Daniel Franco", email = "daniel.franco.inbox@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "llm",
    "agents",
    "context-window",
    "context-engineering",
    "profiler",
    "tokens",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dfranco-projects/ctxspy"
Repository = "https://github.com/dfranco-projects/ctxspy"
Issues = "https://github.com/dfranco-projects/ctxspy/issues"
Changelog = "https://github.com/dfranco-projects/ctxspy/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ctxspy --cov-report=term-missing"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/ctxspy/__init__.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = true
major_on_zero = false
# Runs inside the PSR GitHub Action's Docker container, which has pip but not uv.
build_command = """
    python -m pip install 'uv ~= 0.11.14'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=10.6.1",
    "ruff>=0.16.4",
]
