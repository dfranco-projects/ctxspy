name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gate: never release from a broken main, even if CI hasn't finished yet.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Lint, typecheck, test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests
          uv run pytest

  release:
    needs: verify
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # The PSR Docker action installs GitPython at image build time and is broken
      # by GitPython 3.1.60 (PSR issue #1476). Running the CLI from our locked
      # environment pins GitPython and keeps CI identical to local runs.
      - name: Semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          uv run semantic-release version
          after=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach dists to GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release publish
      - name: Upload dist artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctxspy/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
